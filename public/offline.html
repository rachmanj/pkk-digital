<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0f766e">
    <title>Tidak ada koneksi — Buku PKK Digital</title>
    <style>
        :root {
            color-scheme: light;
        }
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f0fdfa;
            color: #134e4a;
            padding: 1.5rem;
        }
        .card {
            max-width: 22rem;
            width: 100%;
            background: #fff;
            border-radius: 0.75rem;
            padding: 1.75rem 1.5rem;
            box-shadow: 0 4px 24px rgba(15, 118, 110, 0.12);
            border: 1px solid #99f6e4;
            text-align: center;
        }
        h1 {
            font-size: 1.25rem;
            margin: 0 0 0.75rem;
            color: #0f766e;
        }
        p {
            margin: 0 0 1.25rem;
            font-size: 0.95rem;
            line-height: 1.5;
        }
        button {
            appearance: none;
            border: none;
            border-radius: 0.5rem;
            background: #0f766e;
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
            padding: 0.65rem 1.25rem;
            cursor: pointer;
        }
        button:hover {
            background: #0d9488;
        }
        button:focus-visible {
            outline: 2px solid #14b8a6;
            outline-offset: 2px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Tidak ada koneksi internet</h1>
        <p>Periksa jaringan Wi‑Fi atau data seluler Anda. Data yang belum tersimpan tidak akan terkirim ke server.</p>
        <button type="button" onclick="window.location.reload()">Coba lagi</button>
    </div>
</body>
</html>
